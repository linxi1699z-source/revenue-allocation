<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="订阅收入分摊的完整业务流程，按收入登记、日分摊、退款处理与完成校验逐项查看。">
  <title>收入分摊 · 业务流程</title>
  <link rel="stylesheet" href="styles.css?v=fb96d1b88b89">
  <script defer src="data.js?v=505e54432bb2"></script>
  <script defer src="app.js?v=5aa7614e3ed3"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview" aria-label="收入分摊流程首页"><span class="brand-icon" aria-hidden="true">≋</span><span>收入核算<small>业务流程工作台</small></span></a>
    <div class="sidebar-intro"><span class="eyebrow">流程目录</span><h2>订阅收入分摊</h2><p>从订单登记到完成校验</p></div>
    <nav id="flow-menu" aria-label="收入分摊流程菜单"></nav>
    <div class="sidebar-bottom"><span class="status-dot"></span>7 个流程 · 完整业务逻辑<a href="../index.html">返回收入核算后台 <span>↗</span></a></div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="breadcrumb"><button class="mobile-menu" id="mobile-menu" aria-label="展开流程菜单" aria-expanded="false">☰</button><span>财务中心</span><span class="slash">/</span><strong>业务流程</strong></div><a class="source-link" href="https://github.com/linxi1699z-source/revenue-allocation" target="_blank" rel="noopener">GitHub 仓库 <span>↗</span></a></header>
    <main>
      <section class="page-heading"><div><div class="eyebrow heading-eyebrow" id="flow-eyebrow">收入分摊 / 流程一</div><h1 id="flow-title">收入分摊入口与场景分流</h1><p id="flow-description"></p></div><div class="page-counter"><span id="current-number">01</span><small>/ 07</small></div></section>
      <section class="workspace" aria-label="流程查看区域">
        <div class="workspace-header"><div class="diagram-tab"><span class="tab-icon" aria-hidden="true">⑂</span>业务流程图<span class="readonly-chip">只读查看</span><span id="node-count" class="count-chip"></span></div><div class="workspace-actions"><button id="rules-toggle" class="button" aria-expanded="true" aria-controls="details-panel">规则与备注</button><button id="fullscreen" class="button" aria-pressed="false">全屏查看</button></div></div>
        <div class="diagram-toolbar"><div class="legend" aria-label="图例"><span><i class="legend-decision"></i>判断</span><span><i class="legend-formula"></i>公式</span><span><i class="legend-debit"></i>借记</span><span><i class="legend-credit"></i>贷记</span></div><div class="view-controls" aria-label="流程图视图控制"><button id="zoom-out" title="缩小" aria-label="缩小">−</button><output id="zoom-value" aria-live="polite">75%</output><button id="zoom-in" title="放大" aria-label="放大">＋</button><span class="control-divider"></span><button id="fit-width">适应宽度</button><button id="fit-all">完整流程</button><button id="reset-view">重置</button></div></div>
        <div class="canvas-layout"><div class="canvas" id="canvas" tabindex="0" aria-label="流程图画布，可拖动平移或使用视图控制缩放"><div class="scene" id="scene"></div><div class="canvas-loading" id="canvas-loading">正在加载流程图…</div></div><aside class="details-panel" id="details-panel" aria-label="规则与步骤详情"><div class="details-header"><h2 id="details-title">规则与备注</h2><button id="details-close" aria-label="关闭详情">×</button></div><div id="details-content"></div></aside></div>
        <div class="workspace-footer"><span><span class="hint-dot"></span>拖动画布平移 · 点击节点查看详情 · Ctrl / ⌘ + 滚轮缩放</span><div><button id="previous-flow" aria-label="上一个流程">← 上一流程</button><button id="next-flow" aria-label="下一个流程">下一流程 →</button></div></div>
      </section>
      <div class="page-footnote"><span id="flow-source"></span><span>只读流程图 · 支持缩放与全屏查看</span></div>
    </main>
  </div>
  <div id="live-message" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
