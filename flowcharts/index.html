<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="订阅收入分摊的完整业务流程，按收入登记、日分摊、退款处理与完成校验逐项查看。">
  <title>收入分摊 · 业务流程</title>
  <link rel="stylesheet" href="styles.css?v=51706c9ec73a">
  <script defer src="data.js?v=52d069909af4"></script>
  <script defer src="app.js?v=abaa4834648e"></script>
</head>
<body>
  <main class="preview-shell">
      <section class="workspace" aria-label="流程查看区域" aria-labelledby="diagram-title">
        <div class="workspace-header"><div class="workspace-heading"><div class="diagram-tab"><span class="tab-icon" aria-hidden="true">⑂</span><h1 id="diagram-title">流程一 收入分摊入口与场景分流</h1><span class="readonly-chip">只读查看</span><span id="node-count" class="count-chip"></span></div><p id="flow-description" class="flow-description"></p></div><div class="workspace-actions"><button id="rules-toggle" class="button" aria-expanded="true" aria-controls="details-panel">规则与备注</button></div></div>
        <div class="diagram-toolbar"><div class="legend" aria-label="图例"><span><i class="legend-decision"></i>判断</span><span><i class="legend-formula"></i>公式</span><span><i class="legend-debit"></i>借记</span><span><i class="legend-credit"></i>贷记</span></div><div class="view-controls" aria-label="流程图视图控制"><button id="zoom-out" title="缩小" aria-label="缩小">−</button><output id="zoom-value" aria-live="polite">75%</output><button id="zoom-in" title="放大" aria-label="放大">＋</button><span class="control-divider"></span><button id="fit-width">适应宽度</button><button id="fit-all">完整流程</button><button id="reset-view">重置</button></div></div>
        <div class="canvas-layout"><div class="canvas" id="canvas" tabindex="0" aria-label="流程图画布，可拖动平移或使用视图控制缩放"><div class="scene" id="scene"></div><div class="canvas-loading" id="canvas-loading">正在加载流程图…</div></div><aside class="details-panel" id="details-panel" aria-label="规则与步骤详情"><div class="details-header"><h2 id="details-title">规则与备注</h2><button id="details-close" aria-label="关闭详情">×</button></div><div id="details-content"></div><p id="flow-source" class="flow-source"></p></aside></div>
        <footer class="workspace-footer"><nav id="fullscreen-flow-tabs" class="fullscreen-flow-tabs" aria-label="流程切换"></nav></footer>
      </section>
  </main>
  <div id="live-message" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
